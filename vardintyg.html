const PLACEHOLDER = {
  observations:"Beskriv patientens psykiska status, beteende och relevanta somatiska fynd...",
  disorder:"Beskriv arten och graden av den psykiska störningen...",

};
const TIPS = {
  observations:'Tips: Beskriv specifika observerbara beteenden, uttalanden och symtom.',
  disorder:'Tips: Ange tydligt arten och graden av störningen. Använd formuleringen "allvarlig psykisk störning".',

/* ---------- State ---------- */
const state = {
  activeSection:"intro",
  condition:"",
  formData:{ observations:"", disorder:"", careNeeds:"", patientAttitude:"opposes",
             patientInfo:"", otherPersonInfo:"", journalInfo:"", otherDocsInfo:"" },
  showGuidance:{ observations:false, disorder:false, careNeeds:false, attitude:false,
                 patientInfo:false, otherPersonInfo:false, journalInfo:false, otherDocsInfo:false }
};

/* ---------- Helpers ---------- */
const corrections = {
  'halucination':'hallucination','psykiatrisk tvangsvård':'psykiatrisk tvångsvård',
  'allvarig psykisk störning':'allvarlig psykisk störning','oundgangeligt':'oundgängligt',
  'schizofreni':'schizofreni','suicid':'suicid','tankestorning':'tankestörning','vanforestallning':'vanföreställning'
};
function autocorrect(value){
  let v = value;
  Object.keys(corrections).forEach(inc => { v = v.replace(new RegExp(inc,'gi'), corrections[inc]); });
  return v;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function guideHTML(field){
  const g = GUIDE[field]; if(!g || !state.showGuidance[field]) return "";
  return `<div class="vi-guide"><h5>${esc(g.title)}</h5><ul>${g.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`;
}
function chipsHTML(field){
  return `<div class="vi-chips">${CHIPS[field].map((c,i)=>
    `<button class="vi-chip" data-action="append" data-field="${field}" data-idx="${i}">${esc(c[0])}</button>`).join("")}</div>`;
}
function fieldHTML(field, heading, tag, opts){
  opts = opts || {};
  const spell = opts.spell ? `<span class="vi-spell">✓ Stavningskontroll aktiv</span>` : "";
  const tip = opts.tip ? `<p class="vi-tips">${esc(opts.tip)}</p>` : "";
  return `
    <${tag} >${esc(heading)}
      <button class="vi-guide-btn" data-action="toggle" data-field="${field}">ⓘ Vägledning</button>
    </${tag}>
    ${guideHTML(field)}
    <textarea class="vi-ta ${opts.big?'h32':'h24'}" data-field="${field}" placeholder="${esc(PLACEHOLDER[field])}"></textarea>
    <div class="vi-meta">${tip}${spell}</div>
    ${chipsHTML(field)}`;
}

function viewTemplate(){
  return `
  <h2 class="section-title" style="margin-top:0;">Vårdintyg mall: ${esc(conditionLabels[state.condition] || "")}</h2>

  <div class="vi-field">${fieldHTML('disorder','Bedömning av patientens allvarliga psykiska störning','h3',{spell:true,tip:TIPS.disorder})}</div>
  <div class="vi-field">${fieldHTML('careNeeds','Bedömning av patientens vårdbehov','h3',{big:true,spell:true,tip:TIPS.careNeeds})}</div>
  <h3 class="section-title">Eventuella övriga underlag av betydelse för bedömningen</h3>
  <div class="vi-sub">${fieldHTML('patientInfo','Uppgifter från patienten själv','h4',{})}</div>
  <div class="vi-sub">${fieldHTML('otherPersonInfo','Information från andra personer än patienten','h4',{})}</div>

const titles = { intro:"Vårdintygs-assistent", legal:"Juridiska krav för LPT",
  guidelines:"Vägledning för att skriva ett vårdintyg", template:"Vårdintyg – mallgenerator" };

function render(scrollTop){
  document.getElementById('vi-title').textContent = titles[state.activeSection];
  const app = document.getElementById('vi-app');
  if(state.activeSection==='intro') app.innerHTML = viewIntro();
  else if(state.activeSection==='legal') app.innerHTML = viewLegal();
  else if(state.activeSection==='guidelines') app.innerHTML = viewGuidelines();
  else app.innerHTML = viewTemplate();
  // hydrate textareas
  if(state.activeSection==='template'){
    app.querySelectorAll('textarea[data-field]').forEach(ta=>{
      ta.value = state.formData[ta.dataset.field] || "";
    });
  }
  if(scrollTop) window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- Logic ---------- */
function selectCondition(cond){
  state.condition = cond;
  const t = templates[cond] || templates.blank;
  state.formData = { observations:t.observations, disorder:t.disorder, careNeeds:t.careNeeds,
    patientAttitude:'opposes', patientInfo:t.patientInfo, otherPersonInfo:t.otherPersonInfo,
    journalInfo:t.journalInfo, otherDocsInfo:t.otherDocsInfo };
  Object.keys(state.showGuidance).forEach(k=>state.showGuidance[k]=false);
  state.activeSection = 'template';
  render(true);
}

function appendSnippet(field, raw){
  const snip = raw.trim();
  const cur = (state.formData[field] || "").replace(/\s+$/, "");
  // separate from previous sentence with a full stop
  const sep = cur ? (/[.!?:]$/.test(cur) ? " " : ". ") : "";
  // add a trailing full stop if this snippet is a complete sentence
  const fragment = /\b(att|genom|av|på|till|för|med|som)$/i.test(snip);
  const tail = (!fragment && !/[.!?:]$/.test(snip)) ? "." : "";
  state.formData[field] = autocorrect(cur + sep + snip + tail);
}

function buildVardintygText(){
  const d = new Date().toLocaleDateString('sv-SE');
  const f = state.formData;
  const attitude = f.patientAttitude==='opposes'
    ? 'Patienten motsätter sig vården'
    : 'Patienten accepterar vården men det finns grundad anledning att tro att den inte kan ges med dennes samtycke';
  let out = `VÅRDINTYG - ${d}

IAKTTAGELSER VID UNDERSÖKNINGEN:
${f.observations || ''}

BEDÖMNING AV PATIENTENS ALLVARLIGA PSYKISKA STÖRNING:
${f.disorder || ''}

BEDÖMNING AV PATIENTENS VÅRDBEHOV:
${f.careNeeds || ''}`;

  const underlag = [
    ['Uppgifter från patienten själv', f.patientInfo],
    ['Information från andra personer än patienten', f.otherPersonInfo],
    ['Uppgifter från patientens journal', f.journalInfo],
    ['Uppgifter från andra handlingar än patientens journal', f.otherDocsInfo]
  ].filter(u => u[1] && u[1].trim());

  if(underlag.length){
    out += `\n\nÖVRIGA UNDERLAG AV BETYDELSE FÖR BEDÖMNINGEN:`;
    underlag.forEach(u => { out += `\n\n${u[0]}:\n${u[1]}`; });
  }

  out += `\n\nPATIENTENS INSTÄLLNING TILL ERBJUDEN PSYKIATRISK VÅRD:\n${attitude}\n`;
  return out;
}
function validate(){
  const e = [];
  if(!state.formData.observations || state.formData.observations.length < 50)
    e.push("Iakttagelser vid undersökningen är för kortfattade. Beskriv mer detaljerat patientens beteende och symtom.");
  if(!state.formData.disorder || !state.formData.disorder.toLowerCase().includes("allvarlig psykisk störning"))
    e.push("Bedömningen måste uttryckligen ange att tillståndet utgör en 'allvarlig psykisk störning'.");
  if(!state.formData.careNeeds || !state.formData.careNeeds.toLowerCase().includes("oundgänglig"))
    e.push("Vårdbehovet måste beskrivas som 'oundgängligt' för att uppfylla lagens krav.");
  return e;
}
function exportText(){
  const errs = validate();
  if(errs.length){ alert("Följande problem hittades i vårdintyget:\n\n" + errs.join("\n")); return; }
  const d = new Date().toLocaleDateString('sv-SE');
  const blob = new Blob([buildVardintygText()], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `vardintyg_${d.replace(/-/g,'')}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function copyText(){
  const errs = validate();
  if(errs.length){ alert("Följande problem hittades i vårdintyget:\n\n" + errs.join("\n")); return; }
  navigator.clipboard.writeText(buildVardintygText()).then(
    ()=>alert("Vårdintyget är kopierat till urklipp."),
    ()=>alert("Kunde inte kopiera automatiskt – markera och kopiera manuellt.")
  );
}

/* ---------- Events ---------- */
const app = document.getElementById('vi-app');
app.addEventListener('click', e=>{
  const btn = e.target.closest('[data-action]'); if(!btn) return;
  const a = btn.dataset.action;
  if(a==='select') selectCondition(btn.dataset.condition);
  else if(a==='goto'){ state.activeSection = btn.dataset.section; render(true); }
  else if(a==='toggle'){ const f=btn.dataset.field; state.showGuidance[f]=!state.showGuidance[f]; render(false); }
  else if(a==='append'){
    const f=btn.dataset.field;
    appendSnippet(f, CHIPS[f][+btn.dataset.idx][1]);
    const ta = app.querySelector(`textarea[data-field="${f}"]`);
    if(ta){ ta.value = state.formData[f]; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  else if(a==='export') exportText();
  else if(a==='copy') copyText();
});
app.addEventListener('input', e=>{
  const ta = e.target.closest('textarea[data-field]'); if(!ta) return;
  const corrected = autocorrect(ta.value);
  state.formData[ta.dataset.field] = corrected;
  if(corrected !== ta.value) ta.value = corrected;
});
app.addEventListener('change', e=>{
  if(e.target.name==='attitude') state.formData.patientAttitude = e.target.value;
});

render();
</script>
